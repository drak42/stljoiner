# Publish a GitHub release when a version tag (for example v0.2.0) is pushed,
# then upload the same files to PyPI. The tag must match the version in
# src/stljoiner/version.py, and the release notes are that version's section
# of CHANGELOG.md.
#
# PyPI uses trusted publishing: pypi.org trusts this workflow (owner drak42,
# repository stljoiner, workflow release.yml, environment pypi), so no token
# is stored. The "pypi" environment in the repository settings can require an
# approval before each upload.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "from stljoiner.version import __version__; print(__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in version.py" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Lint and test
        run: |
          ruff check .
          pytest -q

      - name: Build
        run: |
          python -m build
          twine check --strict dist/*

      - name: Keep the package files for the PyPI upload
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: )", text, re.S | re.M)
          if not match or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          notes = match.group(1).strip()
          notes += "\n\nInstall: `pipx install stljoiner`\n\n"
          notes += "If stljoiner saves a print, you can [buy me a coffee](https://buymeacoffee.com/drak42) ☕\n"
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *a*|*b*|*rc*|*dev*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "stljoiner $VERSION" \
            --notes-file release-notes.md \
            $prerelease

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stljoiner
    permissions:
      id-token: write  # trusted publishing; nothing else is needed
    steps:
      - name: Get the package files built and checked by the release job
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
