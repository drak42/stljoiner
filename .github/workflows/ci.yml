# Run the checks on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os == 'windows-latest' && format('Windows, Python {0}', matrix.python-version) || matrix.os == 'macos-latest' && format('macOS, Python {0}', matrix.python-version) || format('Python {0}', matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        shell: bash  # the same commands on Linux, macOS and Windows (Git Bash)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Build package
        run: |
          python -m build
          twine check --strict dist/*
