# Run the checks on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv venv
          uv pip install -r requirements.txt pytest
      - name: Lint (ruff)
        run: uvx ruff check .
      - name: Tests (pytest)
        run: .venv/bin/python -m pytest -q
